---
id: https://w3id.org/carrollaboratory/md-terminology-trove/term-concept
name: md-terminology-trove-term-concept
imports:
  - linkml:types
  - md_terminology_trove

classes:
  Concept:
    description: >-
      Flat table containing the curied codes for all ontological terms used for dataset annotations.

    slots:
      - concept_curie
      - vocabulary_id
      - concept_code
      - omop_concept_id
      - display
      - definition
      - deprecated
      - replaced_by
      - dbt_updated_at
      - dbt_valid_from
      - dbt_valid_to
      - dbt_scd_id
    slot_usage:
      concept_curie:
        identifier: true
        required: true
        range: uriorcurie

slots:
  concept_curie:
    title: Concept Curie
    description: The standardized curie for the term
    range: Concept
  concept_code:
    title: Concept Code
    description: Identifier as it is defined within the ontology
    required: true
    range: string
  omop_concept_id:
    title: OMOP Concept ID
    description: The OMOP Concept ID for the term, if applicable
    range: integer
  deprecated:
    title: Deprecated
    description: Deprecated T/F?
    range: boolean
  replaced_by:
    title: Replaced By
    description: Concept this concept was superceded by
    range: Concept
  dbt_scd_id:
    range: string
    description: "Reserved for dbt SCD Type 2 tracking. Kept NULL until dbt migration."
    required: false
  dbt_updated_at:
    range: datetime
    description: "The timestamp when the source record was last changed, used by dbt to detect if an update has occurred."
    required: true
  dbt_valid_from:
    range: datetime
    description: "The timestamp indicating when this specific row's historical version became active."
    required: true
  dbt_valid_to:
    range: datetime
    description: "The timestamp indicating when this historical version was superseded. It remains NULL if the row is the currently active version."
    required: false
  display:
    title: Display
    description: The friendly display string of the coded term
    range: string
    multivalued: false
  definition:
    title: Definition
    description: Detailed description for the term
    range: string
    multivalued: false
