---
id: https://w3id.org/carrollaboratory/md-terminology-trove/ontology
name: md-terminology-trove-ontology
imports:
  - linkml:types
  - md_terminology_trove

classes:
  Vocabulary:
    description: >-
      Flat table containing each of the ontologies used for dataset annotations
    slots:
      - vocabulary_id
      - name
      - vocabulary_uri
      - fhir_system
      - prefix
      - description
      - version
      - source # Where were the terms pulled from
    slot_usage:
      vocabulary_id:
        identifier: true
        range: string
slots:
  vocabulary_id:
    title: Vocabulary ID
    description: The ID associated with the vocabulary or ontology inside the warehouse
    required: true
    range: Vocabulary
  name:
    title: Vocabulary Name
    description: Full name for the ontology
    required: false
    range: string
  vocabulary_uri:
    title: Vocabulary URI
    description: Official URI associated with the vocabulary
    required: true
    range: uri
  fhir_system:
    title: FHIR System
    description: System used within FHIR valuesets and codings
    required: true
    range: uri
  prefix:
    title: Canonical Curie Prefix
    description: The authoritative namespace prefix allocated to the vocabulary. Used to resolve compact identifiers (CURIEs) to their full semantic URIs or FHIR system URLs.
    range: string
    pattern: "^[A-Za-z][A-Za-z0-9_\\-\\.]*$"
    comments:
      - "Must start with a letter; thereafter allows letters, digits, underscores, hyphens, and dots to accommodate OLS/UMLS source variability."
      - "RISK: In order for all of our data to correctly join, the format of the prefix must always align with the prefix used in this table."
    todos:
      - "Ensure that MapDragon and TermWeaver both rely on the same rules for prefixes"
  description:
    title: Ontology description
    description: Ontology description
    range: string
    multivalued: false
  version:
    title: Version
    description: Version associated with the current vocabulary content
    range: string
    multivalued: false
  source:
    title: Data source
    description: Source used for populating the terminologies members
    range: string
    multivalued: false
    comments:
      - "This is currently poorly defined because we haven't fully defined the nature of the data pulls. Most likely it will end up as a filename (.owl, .obo, etc) or another tool, etc"
